# Docker Build & Publish CI
#
# Builds and publishes Docker images for GroktoCrawl services to ghcr.io.
# Uses a build matrix with capped parallelism to avoid runner resource exhaustion.
#
# Tags:
#   - main branch → latest, unstable
#   - vX.Y.Z tag  → stable, X, X.Y, X.Y.Z
#   - PR to main  → runtime integration only when changed paths require it

name: Docker Build & Publish

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  REGISTRY_OWNER: groktopus

jobs:
  changes:
    name: Classify runtime changes
    runs-on: ubuntu-latest
    outputs:
      requires_full_runtime: ${{ steps.classify.outputs.requires_full_runtime }}
      affected_services: ${{ steps.classify.outputs.affected_services }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Test change classifier
        run: python3 tests/service/test_ci_change_classification.py

      - name: Classify changed paths
        id: classify
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
            head="${{ github.event.pull_request.head.sha }}"
            merge_base=$(git merge-base "$base" "$head")
            changed_paths=$(git diff --name-only "$merge_base" "$head")
          else
            base="${{ github.event.before }}"
            head="${{ github.sha }}"
            if [ "$base" = "0000000000000000000000000000000000000000" ]; then
              changed_paths=$(git diff-tree --no-commit-id --name-only -r "$head")
            else
              changed_paths=$(git diff --name-only "$base" "$head")
            fi
          fi

          requires_full_runtime=$(printf '%s\n' "$changed_paths" | python3 scripts/classify_ci_changes.py)
          echo "requires_full_runtime=$requires_full_runtime" >> "$GITHUB_OUTPUT"
          affected_services=$(printf '%s\n' "$changed_paths" | python3 scripts/classify_ci_changes.py --affected-services)
          echo "affected_services=$affected_services" >> "$GITHUB_OUTPUT"

  build-and-push:
    name: ${{ matrix.service }}
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - service: agent-svc
            context: .
            dockerfile: agent-svc/Dockerfile
            image: ghcr.io/groktopus/groktocrawl-agent
          - service: scraper-svc
            context: .
            dockerfile: scraper-svc/Dockerfile
            image: ghcr.io/groktopus/groktocrawl-scraper
          - service: browser-svc
            context: .
            dockerfile: browser-svc/Dockerfile
            image: ghcr.io/groktopus/groktocrawl-browser
          - service: semantic-svc
            context: .
            dockerfile: semantic-svc/Dockerfile
            image: ghcr.io/groktopus/groktocrawl-semantic
          - service: portal-svc
            context: .
            dockerfile: portal-svc/Dockerfile
            image: ghcr.io/groktopus/groktocrawl-portal
          - service: parse-svc
            context: .
            dockerfile: parse-svc/Dockerfile
            image: ghcr.io/groktopus/groktocrawl-parse
          - service: mcp-svc
            context: mcp-svc
            dockerfile: mcp-svc/Dockerfile
            image: ghcr.io/groktopus/groktocrawl-mcp
      max-parallel: 2

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ matrix.image }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref_name == 'main' }}
            type=raw,value=unstable,enable=${{ github.ref_name == 'main' }}
            type=raw,value=stable,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=semver,pattern={{major}},enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=semver,pattern={{major}}.{{minor}},enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=semver,pattern={{major}}.{{minor}}.{{patch}},enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=semver,pattern={{raw}},enable=${{ startsWith(github.ref, 'refs/tags/v') }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.ref_name }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Prune untagged versions
        if: github.event_name == 'push'
        shell: bash
        run: |
          PACKAGE_NAME=$(echo "${{ matrix.image }}" | sed 's|.*/||')
          echo "Pruning untagged versions of $PACKAGE_NAME"
          gh api \
            --method GET \
            "/orgs/${{ env.REGISTRY_OWNER }}/packages/container/$PACKAGE_NAME/versions?per_page=100" \
            --jq '.[] | select(.metadata.container.tags == null or .metadata.container.tags == []) | .id' \
            | while read version_id; do
              echo "  Deleting version $version_id"
              gh api --method DELETE \
                "/orgs/${{ env.REGISTRY_OWNER }}/packages/container/$PACKAGE_NAME/versions/$version_id" --silent
          done
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  integration-tests:
    name: Integration Tests
    needs: [changes, build-and-push]
    # The fork guard (mirroring droid-review.yml) keeps untrusted fork PR code off the
    # self-hosted runner. This is a best-effort in-workflow control: on `pull_request`
    # events GitHub runs the workflow from the PR merge ref, so a fork that edits this
    # file could bypass the guard. The authoritative, non-bypassable control is
    # platform-level (deny fork PRs to the runner group / require workflow approval for
    # outside collaborators), which is outside this repo and must be configured there.
    if: >-
      always() && ((github.event_name == 'pull_request' && needs.changes.result == 'success' &&
      needs.changes.outputs.requires_full_runtime == 'true' &&
      github.event.pull_request.head.repo.fork == false) ||
      (github.event_name == 'push' && needs.build-and-push.result == 'success'))
    runs-on: [self-hosted, groktopus, docker]
    concurrency:
      group: groktocrawl-integration-${{ github.repository }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Set up .env
        run: |
          cp .env.sample .env
          echo "LLM_BASE_URL=http://llm-svc:8011/v1" >> .env
          echo "LLM_MODEL=fixture-model" >> .env
          echo "CAPTCHA_VISION_BASE_URL=http://llm-svc:8011/v1" >> .env
          echo "CAPTCHA_VISION_API_KEY=fixture-only" >> .env
          echo "CAPTCHA_VISION_MODEL=fixture-model" >> .env
          echo "SCRAPER_PRIVATE_URL_ALLOWLIST=test-site,tier3-fixture" >> .env
          echo "AGENT_SEARCH_RATE_LIMIT=1000/1s" >> .env
          # mcp-svc DNS-rebinding allowlist: include the compose service name
          # so the integration lane exercises a real non-loopback Host path.
          echo "MCP_ALLOWED_HOSTS=localhost:*,127.0.0.1:*,[::1]:*,mcp-svc:*" >> .env
          # slopsearx-mcp is an opt-in profile-gated companion; it is not run in
          # the integration lane, so no token is needed here.

      - name: Force-remove all stale project containers
        run: docker ps -a --filter name=groktocrawl -q | xargs -r docker rm -f || true

      - name: Clean up stale containers from previous run
        run: docker compose down --remove-orphans --timeout 30 || true

      - name: Ensure HF model cache volume exists
        run: docker volume inspect hf-cache || docker volume create hf-cache

      # Image provisioning is decoupled from stack startup so each service image
      # is built at most once per event (except release tag pushes, which must
      # both publish semver tags and validate the tagged source):
      #   - main push: build-and-push already built and published every image, so
      #     this job pulls the freshly published :latest tags (no rebuild).
      #   - PR: pulls the latest published images for unchanged services (so the
      #     stack matches a known commit), then builds only the images for
      #     services whose paths changed (service-local), gated on the
      #     classifier's affected-services output; unknown/cross-cutting runtime
      #     paths escalate to a full rebuild.
      #   - tag push (v*): build-and-push published only semver tags, so this job
      #     builds the full runtime stack from the tagged source.
      - name: Log in to GitHub Container Registry
        if: >-
          (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
          github.event_name == 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull freshly published service images
        if: >-
          (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
          github.event_name == 'pull_request'
        run: |
          # Best-effort refresh of the published image set. A service may not
          # have a published tag yet (e.g. a newly added service), which fails
          # its manifest lookup; tolerate that and let the build/up steps build
          # the missing image from source instead.
          docker compose --profile indexing pull || true
        timeout-minutes: 10

      - name: Build service images (service-local PR build / tag-push full build)
        if: >-
          github.event_name == 'pull_request' ||
          (github.event_name == 'push' && github.ref != 'refs/heads/main')
        run: |
          affected="${{ needs.changes.outputs.affected_services }}"
          if [ "${{ github.event_name }}" = "pull_request" ] && [ -n "$affected" ] && [ "$affected" != "all" ]; then
            echo "Service-local PR build for: $affected"
            docker compose --profile indexing build $affected
          else
            echo "Building the full runtime stack."
            docker compose --profile indexing build
          fi
        timeout-minutes: 10

      - name: Start the Docker stack
        run: docker compose --profile indexing up -d
        timeout-minutes: 10

      - name: Start test fixtures
        run: |
          # Kill any stale llm-svc container, build fresh image, recreate
          docker compose --profile fixture rm -sf llm-svc || true
          docker compose --profile fixture build --no-cache llm-svc
          docker compose --profile fixture build test-site tier3-fixture slopsearx-fixture agent-svc-fixture
          docker compose --profile fixture up -d --force-recreate llm-svc tier3-fixture test-site slopsearx-fixture agent-svc-fixture
        timeout-minutes: 5

      - name: Wait for services to be healthy
        run: |
          python3 -c "
          import time, urllib.request
          deadline = time.time() + 180
          while time.time() < deadline:
              try:
                  r = urllib.request.urlopen('http://localhost:8080/health', timeout=5)
                  if r.status == 200:
                      print('Stack healthy')
                      break
              except Exception:
                  pass
              time.sleep(3)
          else:
              raise RuntimeError('Timed out waiting for stack')
          "

      - name: Wait for semantic-svc
        run: |
          # First check from host that the API is alive
          python3 -c "
          import time, urllib.request, urllib.error
          deadline = time.time() + 300
          while time.time() < deadline:
              try:
                  r = urllib.request.urlopen('http://localhost:8003/health', timeout=5)
                  data = r.read().decode()
                  if r.status == 200 and '\"ok\"' in data:
                      print('semantic-svc healthy on host')
                      break
              except urllib.error.HTTPError as e:
                  print(f'  waiting ({e.code})...')
              except Exception:
                  pass
              time.sleep(3)
          else:
              raise RuntimeError('Timed out waiting for semantic-svc on host')
          "
          # Verify Qdrant is reachable from inside agent-svc (where tests run)
          python3 -c "
          import time, subprocess
          deadline = time.time() + 60
          while time.time() < deadline:
              r = subprocess.run(
                  ['docker', 'compose', 'exec', '-T', 'agent-svc',
                   'python3', '-c',
                   'import urllib.request; u=urllib.request.urlopen(\"http://semantic-svc:8003/index/stats\", timeout=5); print(u.status)'],
                  capture_output=True, text=True, timeout=10
              )
              if r.returncode == 0 and '200' in r.stdout:
                  print(f'Qdrant ready from agent-svc')
                  break
              print(f'  waiting from agent-svc (rc={r.returncode}): {r.stdout[:80]}')
              time.sleep(5)
          else:
              raise RuntimeError('Timed out waiting for Qdrant from agent-svc')
          "

      - name: Wait for tier3-fixture
        run: |
          python3 -c "
          import time, urllib.request
          deadline = time.time() + 30
          while time.time() < deadline:
              try:
                  r = urllib.request.urlopen('http://localhost:8006/health', timeout=5)
                  if r.status == 200:
                      print('tier3-fixture healthy')
                      break
              except Exception:
                  pass
              time.sleep(2)
          else:
              raise RuntimeError('Timed out waiting for tier3-fixture')
          "

      - name: Wait for test-site
        run: |
          python3 -c "
          import time, urllib.request
          deadline = time.time() + 60
          while time.time() < deadline:
              try:
                  r = urllib.request.urlopen('http://localhost:8005/health', timeout=5)
                  if r.status == 200:
                      print('test-site healthy')
                      break
              except Exception:
                  pass
              time.sleep(2)
          else:
              raise RuntimeError('Timed out waiting for test-site')
          "

      - name: Wait for slopsearx-fixture
        run: |
          python3 -c "
          import time, urllib.request
          deadline = time.time() + 60
          while time.time() < deadline:
              try:
                  r = urllib.request.urlopen('http://localhost:8083/health', timeout=5)
                  if r.status == 200:
                      print('slopsearx-fixture healthy')
                      break
              except Exception:
                  pass
              time.sleep(2)
          else:
              raise RuntimeError('Timed out waiting for slopsearx-fixture')
          "

      - name: Wait for agent-svc-fixture
        run: |
          python3 -c "
          import time, urllib.request
          deadline = time.time() + 120
          while time.time() < deadline:
              try:
                  r = urllib.request.urlopen('http://localhost:8084/health', timeout=5)
                  if r.status == 200:
                      print('agent-svc-fixture healthy')
                      break
              except Exception:
                  pass
              time.sleep(3)
          else:
              raise RuntimeError('Timed out waiting for agent-svc-fixture')
          "

      - name: Reset isolated test state
        run: |
          docker compose exec -T valkey valkey-cli -n 0 FLUSHDB
          docker compose exec -T valkey valkey-cli -n 1 FLUSHDB

      - name: Copy test files and source directories
        run: |
          mkdir -p coverage
          svc=$(docker compose ps -q agent-svc)
          # Copy full tests/ directory and root Compose contract input
          docker compose exec -T agent-svc mkdir -p /app/tests
          docker cp tests/. "$svc":/app/tests/
          docker cp docker-compose.yml "$svc":/app/docker-compose.yml
          docker compose exec -T agent-svc mkdir -p /app/scripts
          docker cp scripts/classify_ci_changes.py "$svc":/app/scripts/classify_ci_changes.py
          docker cp scripts/coverage_gate.py "$svc":/app/scripts/coverage_gate.py
          # Copy the stdlib benchmark harness so tests/service/test_benchmark_harness.py
          # can `from benchmarks.run_benchmarks import ...` inside the container.
          docker compose exec -T agent-svc mkdir -p /app/benchmarks
          docker cp benchmarks/. "$svc":/app/benchmarks/
          docker compose exec -T agent-svc mkdir -p /app/.github/workflows
          docker cp .github/workflows/docker.yml "$svc":/app/.github/workflows/docker.yml
          docker cp .github/workflows/fast-tests.yml "$svc":/app/.github/workflows/fast-tests.yml
          # Refresh the baked agent package at the path Python imports from /app.
          docker compose exec -T agent-svc mkdir -p /app/agent
          docker cp agent-svc/agent/. "$svc":/app/agent/
          # Copy the remaining service packages under their repository paths.
          for pkg in scraper-svc/scraper parse-svc/parse_svc portal-svc/portal browser-svc/browser_svc llm-svc/llm_svc slopsearx-fixture/slopsearx_fixture common; do
            docker compose exec -T agent-svc mkdir -p "/app/$pkg"
            docker cp "$pkg/." "$svc:/app/$pkg/"
          done
          # Copy mcp-svc package + its tests under /app/mcp-svc
          docker compose exec -T agent-svc mkdir -p /app/mcp-svc
          docker cp mcp-svc/. "$svc:/app/mcp-svc/"

      - name: Install critical test dependencies
        run: docker compose exec -T agent-svc pip install pytest pytest-asyncio pytest-cov pytest-timeout jinja2 tabulate markdownify==1.2.3 readability-lxml==0.8.4.1 firecrawl-anydoc==0.1.9 pypdf -q

      - name: Verify LLM fixture contract and agent routing
        run: |
          docker compose exec -T agent-svc python3 -c "
          import os
          assert os.environ['LLM_BASE_URL'] == 'http://llm-svc:8011/v1', os.environ.get('LLM_BASE_URL')
          print('agent LLM routing verified')
          "
          docker compose exec -T agent-svc python3 -c "
          import json, urllib.request
          endpoint = 'http://llm-svc:8011/v1/chat/completions'
          def chat(messages, response_format=None):
              body = {'model': 'fixture-model', 'messages': messages}
              if response_format:
                  body['response_format'] = response_format
              request = urllib.request.Request(endpoint, data=json.dumps(body).encode(), headers={'Content-Type': 'application/json'})
              return json.load(urllib.request.urlopen(request, timeout=10))['choices'][0]['message']['content']
          citation = chat([
              {'role': 'system', 'content': 'Cite sources by their URL whenever you use information.'},
              {'role': 'user', 'content': 'explain REST API authentication methods'},
          ])
          # The fixture emits the raw marker; the targeted integration test below
          # verifies agent post-processing resolves it to [1](url).
          assert '[1]' in citation, citation
          schema = {'type': 'object', 'properties': {'comparison': {'type': 'object', 'properties': {'pros': {'type': 'array', 'items': {'type': 'string'}}}}}}
          structured = chat([
              {'role': 'system', 'content': 'MUST respond with valid JSON matching this schema:' + json.dumps(schema)},
              {'role': 'user', 'content': 'compare'},
          ], {'type': 'json_object'})
          assert json.loads(structured) == {'comparison': {'pros': ['value', 'value']}}, structured
          print('LLM fixture citation and schema contracts verified')
          "

      - name: Run targeted source-backed agent contracts
        run: |
          docker compose exec -T agent-svc env \
            PYTHONPATH=/app/agent-svc:/app/scraper-svc:/app/llm-svc:/app/parse-svc:/app/portal-svc:/app/browser-svc:/app \
            QA_OUTCOME_PATH=/tmp/qa-outcomes-targeted.json \
            python3 -m pytest /app/tests/integration/test_stack.py \
              -k 'test_cross_endpoint_compact_citations_resolvable or test_cross_plan_agent_structured_output_val_cross_005' \
              --no-cov -o 'addopts=' -p no:cacheprovider -q
        timeout-minutes: 5

      - name: Critical journey smoke
        run: |
          docker compose exec -T agent-svc mkdir -p /app/coverage
          set +e
          docker compose exec -T agent-svc env \
            QA_OUTCOME_PATH=/app/qa-outcomes-critical.json \
            AGENT_BASE_URL=http://agent-svc-fixture:8080 \
            PYTHONPATH=/app/agent-svc:/app/scraper-svc:/app/llm-svc:/app/parse-svc:/app/portal-svc:/app/browser-svc:/app \
            SCRAPER_BASE_URL=http://scraper-svc:8001 \
            SEARCH_BASE_URL=http://slopsearx:8080 \
            LLM_BASE_URL=http://llm-svc:8011 \
            TEST_SITE_BASE_URL=http://test-site:8000 \
            TIER3_FIXTURE_BASE_URL=http://tier3-fixture:8000 \
            SEMANTIC_BASE_URL=http://semantic-svc:8003 \
            python3 -m pytest /app/tests/integration/test_critical_journey.py -vv -rA -m 'not external' \
              --cov=/app/agent \
              --cov=/app/scraper-svc/scraper \
              --cov=/app/parse-svc/parse_svc \
              --cov=/app/portal-svc/portal \
              --cov=/app/browser-svc/browser_svc \
              --cov=/app/common \
              --cov-report=xml:/app/coverage/critical.xml \
              --cov-report=json:/app/coverage/critical.json \
              --cov-report=term-missing \
              --cov-fail-under=0
          pytest_status=$?
          svc=$(docker compose ps -q agent-svc)
          docker cp "$svc:/app/qa-outcomes-critical.json" qa-outcomes-critical.json || true
          docker cp "$svc:/app/qa-outcomes-critical.md" qa-outcomes-critical.md || true
          docker cp "$svc:/app/coverage/." coverage/ || true
          if [ "$pytest_status" -ne 0 ]; then
            docker compose logs --tail 50 test-site scraper-svc || true
          fi
          exit "$pytest_status"
        timeout-minutes: 20

      - name: Run CAPTCHA runtime probe
        run: docker compose exec -T scraper-svc python - < tests/integration/captcha_runtime_probe.py

      - name: Run integration tests
        run: |
          docker compose exec -T agent-svc pip install pytest pytest-asyncio pytest-cov pytest-xdist pytest-timeout jinja2 tabulate markdownify==1.2.3 readability-lxml==0.8.4.1 firecrawl-anydoc==0.1.9 pypdf PyYAML -q
          docker compose exec -T agent-svc mkdir -p /app/coverage
          set +e
          docker compose exec -T agent-svc env \
            QA_OUTCOME_PATH=/app/qa-outcomes-integration.json \
            PYTHONPATH=/app/agent-svc:/app/scraper-svc:/app/llm-svc:/app/parse-svc:/app/portal-svc:/app/browser-svc:/app \
            SCRAPER_BASE_URL=http://scraper-svc:8001 \
            SEARCH_BASE_URL=http://slopsearx:8080 \
            LLM_BASE_URL=http://llm-svc:8011 \
            TEST_SITE_BASE_URL=http://test-site:8000 \
            TIER3_FIXTURE_BASE_URL=http://tier3-fixture:8000 \
            SEMANTIC_BASE_URL=http://semantic-svc:8003 \
            python3 -m pytest /app/tests/integration/ /app/tests/service/ --timeout=120 --ignore-glob='*observability*' --ignore=/app/tests/integration/test_critical_journey.py -m 'not external' \
              --cov=/app/agent \
              --cov=/app/scraper-svc/scraper \
              --cov=/app/parse-svc/parse_svc \
              --cov=/app/portal-svc/portal \
              --cov=/app/browser-svc/browser_svc \
              --cov=/app/common \
              --cov-report=xml:/app/coverage/integration.xml \
              --cov-report=json:/app/coverage/integration.json \
              --cov-report=term-missing \
              --cov-fail-under=0
          pytest_status=$?
          svc=$(docker compose ps -q agent-svc)
          docker cp "$svc:/app/qa-outcomes-integration.json" qa-outcomes-integration.json || true
          docker cp "$svc:/app/qa-outcomes-integration.md" qa-outcomes-integration.md || true
          docker cp "$svc:/app/coverage/." coverage/ || true
          exit "$pytest_status"
        timeout-minutes: 20

      - name: Run mcp-svc integration tests (Host-header / transport security)
        run: |
          docker compose exec -T agent-svc pip install pytest pytest-asyncio httpx -q
          set +e
          docker compose exec -T agent-svc env \
            MCP_URL=http://mcp-svc:8002/mcp \
            AGENT_URL=http://agent-svc:8080 \
            MCP_TEST_ALLOWED_HOST=mcp-svc:8002 \
            MCP_TEST_DISALLOWED_HOST=not-allowed.invalid:8002 \
            python3 -m pytest /app/mcp-svc/tests/test_integration.py \
              -k "TestHostHeaderTransportSecurity" -vv -rA -m 'not external'
          pytest_status=$?
          exit "$pytest_status"
        timeout-minutes: 10

      - name: Check changed-line coverage
        id: coverage_gate
        env:
          COVERAGE_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          COVERAGE_HEAD_SHA: ${{ github.sha }}
        run: |
          if [ "$COVERAGE_BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            echo "Changed-line coverage skipped: no prior commit exists for this ref."
            exit 0
          fi
          python3 scripts/coverage_gate.py \
            --coverage-json coverage/critical.json \
            --coverage-json coverage/integration.json \
            --base-sha "$COVERAGE_BASE_SHA" \
            --head-sha "$COVERAGE_HEAD_SHA" \
            --summary-path coverage/docker-risk-summary.md

      - name: Publish integration outcome summary
        if: always()
        run: cat qa-outcomes-*.md >> "$GITHUB_STEP_SUMMARY" || true

      - name: Capture sanitized LLM fixture diagnostics
        if: always()
        run: |
          python3 - <<'PY'
          import json
          import urllib.request
          allowed = {"request_id", "schema_version", "fixture_version", "scenario", "scenario_version", "run_id", "status", "classification", "model", "stream"}
          try:
              with urllib.request.urlopen("http://localhost:8011/diagnostics", timeout=5) as response:
                  payload = json.load(response)
              entries = [{key: value for key, value in entry.items() if key in allowed} for entry in payload.get("entries", [])]
              output = {"schema_version": payload.get("schema_version"), "fixture_version": payload.get("fixture_version"), "entries": entries}
          except Exception as exc:
              output = {"error": "diagnostics unavailable", "classification": type(exc).__name__}
          with open("llm-fixture-diagnostics.json", "w") as file:
              json.dump(output, file, indent=2)
          PY

      - name: Publish coverage summary
        if: always()
        run: |
          if [ -f coverage/docker-risk-summary.md ]; then
            cat coverage/docker-risk-summary.md >> "$GITHUB_STEP_SUMMARY"
          elif [ "${{ steps.coverage_gate.outcome }}" = "success" ] && { [ -f coverage/critical.json ] || [ -f coverage/integration.json ]; }; then
            echo "Changed-line coverage comparison skipped: no prior commit exists for this ref." >> "$GITHUB_STEP_SUMMARY"
          elif [ "${{ steps.coverage_gate.outcome }}" = "skipped" ]; then
            echo "Changed-line coverage comparison did not run because an earlier test step failed." >> "$GITHUB_STEP_SUMMARY"
          elif [ "${{ steps.coverage_gate.outcome }}" != "success" ]; then
            echo "Changed-line coverage gate failed before writing its summary." >> "$GITHUB_STEP_SUMMARY"
          elif [ ! -f coverage/critical.json ] && [ ! -f coverage/integration.json ]; then
            echo "Changed-line coverage report unavailable; coverage JSON files are missing from the workspace." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload integration outcome reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: integration-test-outcomes
          path: qa-outcomes-*
          if-no-files-found: warn

      - name: Upload LLM fixture diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: llm-fixture-diagnostics
          path: llm-fixture-diagnostics.json
          if-no-files-found: warn

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: integration-test-coverage
          path: coverage/*
          if-no-files-found: warn

      - name: Collect diagnostics on failure
        if: failure()
        run: |
          report="$GITHUB_WORKSPACE/integration-test-diagnostics.txt"
          {
            echo "Integration test failure diagnostics"
            echo "Collected at: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo
            echo "=== docker compose ps -a ==="
            docker compose ps -a || true
            echo
            echo "=== docker stats --no-stream ==="
            docker stats --no-stream || true
            echo
            echo "=== host memory ==="
            free -h || vm_stat || true
            echo
            echo "=== host filesystem ==="
            df -h || true
            echo
            echo "=== project container state ==="
            docker ps -aq --filter "name=groktocrawl" | while read -r container; do
              docker inspect --format \
                'Name={{.Name}} Status={{.State.Status}} ExitCode={{.State.ExitCode}} FinishedAt={{.State.FinishedAt}} Error={{.State.Error}} OOMKilled={{.State.OOMKilled}}' \
                "$container" || true
            done || true
            echo
            echo "=== docker compose logs (last 50 lines) ==="
            docker compose logs --tail 50 || true
          } > "$report" 2>&1 || true

      - name: Upload integration test diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: integration-test-diagnostics
          path: integration-test-diagnostics.txt
          if-no-files-found: warn

      - name: Tear down stack
        if: always()
        run: docker compose down --remove-orphans --timeout 30

  runtime-gate:
    name: Runtime Gate
    needs: [changes, integration-tests]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Summarize docs-only pull request
        if: >-
          github.event_name == 'pull_request' && needs.changes.result == 'success' &&
          needs.changes.outputs.requires_full_runtime == 'false'
        run: echo "Runtime integration was intentionally not needed for this docs-only pull request."

      - name: Summarize fork pull request (integration skipped)
        if: >-
          github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork == true &&
          needs.changes.result == 'success'
        run: 'echo "Fork pull request: self-hosted integration skipped for security."'

      - name: Summarize successful runtime validation
        if: >-
          github.event_name == 'pull_request' && needs.changes.result == 'success' &&
          needs.changes.outputs.requires_full_runtime == 'true' &&
          needs.integration-tests.result == 'success'
        run: echo "Runtime integration completed successfully for this pull request."

      - name: Fail when change classification fails
        if: >-
          github.event_name == 'pull_request' &&
          needs.changes.result != 'success'
        run: |
          echo "Change classification did not complete; no runtime-validation conclusion was made."
          exit 1

      - name: Fail when required runtime validation fails
        if: >-
          needs.changes.result == 'success' &&
          !(github.event_name == 'pull_request' &&
          needs.changes.outputs.requires_full_runtime == 'false') &&
          !(github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.fork == true) &&
          needs.integration-tests.result != 'success'
        run: |
          echo "Required runtime integration did not complete successfully."
          exit 1
