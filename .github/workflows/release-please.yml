# Release Please — automated changelog generation and version management
# On merge to main, creates/updates a release PR with changelog entries.
# When the release PR is merged, creates a GitHub release and version tag.
#
# See: https://github.com/googleapis/release-please-action

name: Release Please

on:
  push:
    branches: [main]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v5
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
